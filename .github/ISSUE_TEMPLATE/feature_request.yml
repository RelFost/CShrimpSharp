name: Feature request
description: Propose a focused API or behavior improvement.
title: "proposal: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete problem without prescribing an API first.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
      description: Show how the problem is handled with the existing API or base class library.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API and semantics
      description: Include complete signatures and define success, failure, cancellation, child lifetime, and rollback behavior.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain simpler library-level or application-level alternatives.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: The proposal does not require changing C# syntax or compiling Verse source.
          required: true
        - label: I searched existing issues and roadmap items.
          required: true
