name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore CShrimpSharp.sln
      - run: dotnet format CShrimpSharp.sln --verify-no-changes --no-restore
      - run: dotnet build CShrimpSharp.sln -c Release --no-restore
      - run: dotnet test CShrimpSharp.sln -c Release --no-build
      - run: dotnet pack src/CShrimpSharp/CShrimpSharp.csproj -c Release --no-build -o artifacts/packages
      - name: Create source archive
        run: git archive --format=zip --output=artifacts/CShrimpSharp-source.zip HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: cshrimp-sharp-${{ github.sha }}
          path: artifacts/
