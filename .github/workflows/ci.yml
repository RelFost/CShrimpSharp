name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CShrimpSharp.sln

      - name: Verify formatting
        run: dotnet format CShrimpSharp.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CShrimpSharp.sln --configuration Release --no-restore

      - name: Test .NET 8 and .NET 10
        run: dotnet test --solution CShrimpSharp.sln --configuration Release --no-build --report-trx --results-directory artifacts/test-results

      - name: Pack
        run: dotnet pack src/CShrimpSharp/CShrimpSharp.csproj --configuration Release --no-build --output artifacts/packages

      - name: NuGet package smoke test
        run: ./scripts/package-smoke.sh

      - name: Trimming smoke test
        run: dotnet publish samples/CShrimpSharp.Example/CShrimpSharp.Example.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishTrimmed=true --output artifacts/trimmed

      - name: AOT smoke test
        run: dotnet publish samples/CShrimpSharp.Example/CShrimpSharp.Example.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishAot=true --output artifacts/aot

      - name: Create source archive
        run: git archive --format=zip --output=artifacts/CShrimpSharp-source.zip HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: cshrimp-sharp-${{ github.sha }}
          path: |
            artifacts/packages
            artifacts/test-results
            artifacts/CShrimpSharp-source.zip
