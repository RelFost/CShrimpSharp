name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without v, for example 0.2.0-preview.1
        required: true
        type: string
      publish_nuget:
        description: Publish to nuget.org
        required: true
        default: false
        type: boolean
      publish_github_packages:
        description: Publish to GitHub Packages
        required: true
        default: true
        type: boolean
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - name: Normalize version
        shell: bash
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore CShrimpSharp.sln
      - run: dotnet build CShrimpSharp.sln -c Release --no-restore -p:Version=${{ env.VERSION }}
      - run: dotnet test CShrimpSharp.sln -c Release --no-build
      - run: dotnet pack src/CShrimpSharp/CShrimpSharp.csproj -c Release --no-build -o artifacts -p:PackageVersion=${{ env.VERSION }}
      - run: git archive --format=zip --output=artifacts/CShrimpSharp-${{ env.VERSION }}-source.zip HEAD
      - name: Publish to nuget.org
        if: ${{ inputs.publish_nuget == true }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish to GitHub Packages
        if: ${{ inputs.publish_github_packages != false }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.GITHUB_TOKEN }}" --source https://nuget.pkg.github.com/RelFost/index.json --skip-duplicate
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ env.VERSION }}" artifacts/*.nupkg artifacts/*.snupkg artifacts/*-source.zip --title "CShrimpSharp v${{ env.VERSION }}" --generate-notes --prerelease
